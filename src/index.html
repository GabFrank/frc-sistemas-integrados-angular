<!doctype html>
<html lang="es-PY" class="darkMode">
<head>
  <meta charset="utf-8">
  <!--
    Política de seguridad de contenido (CSP). Lo que más importa es script-src: solo se ejecutan
    los scripts del propio bundle. Ni eval, ni scripts de otros sitios, ni código inline
    (onclick="…", <script>…</script>). Si un texto con HTML se cuela en la pantalla, no corre.

    - 'wasm-unsafe-eval' habilita WebAssembly (tfjs-backend-wasm del reconocimiento facial). No es eval.
    - googletagmanager.com: Firebase Analytics (src/main.ts) inyecta el script de gtag.
    - style-src lleva 'unsafe-inline' porque Angular inyecta los estilos de cada componente en <style>.
    - connect/img/frame quedan abiertos a http/https/ws porque la IP del backend se configura en cada
      PC, y hay mapas, videos (YouTube/Vimeo) e imágenes externas.
    - Por esto el build de producción va con inlineCritical: false (angular.json): ese modo carga el CSS
      con onload="this.media='all'", que esta política bloquea, y la app quedaba sin estilos.
    - Por lo mismo dev y web compilan con aot: true. El modo JIT necesita eval.

    Si algo deja de cargar, la consola muestra «Refused to … because it violates the following
    Content Security Policy directive». Agregar el origen en la directiva que corresponda, nunca
    'unsafe-eval' ni 'unsafe-inline' en script-src.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: http: https:; media-src 'self' data: blob: http: https:; connect-src 'self' data: blob: http: https: ws: wss:; frame-src 'self' data: blob: http: https:; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>FRC Sistemas Informáticos</title>
  <base href="">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Ícono de la pestaña: el logo de Bodega Franco, no el de Angular.

    `assets/images/frc.png` es el original de 512×512 y es la referencia que
    usan los navegadores modernos. `favicon.ico` queda porque el navegador lo
    pide solo, sin mirar el HTML, cuando el link falla o todavía no parseó la
    cabecera; se regeneró desde el mismo PNG (48/32/16) para que en ese
    camino tampoco aparezca el logo de Angular.

    El `?v=2` no es decorativo: el navegador cachea los favicons en una base
    aparte, indexada por la URL del ícono, y no la revalida en cada carga —ni
    con Ctrl+Shift+R—. Toda máquina que ya abrió el sistema tiene guardado el
    escudo de Angular contra `favicon.ico` a secas; con la URL versionada no
    hay entrada previa que reusar y lo baja de nuevo. Si algún día se cambia
    el logo, subir el número.

    Los dos href son relativos y funcionan igual servidos desde `/` que desde
    `file://` en Electron (`build --base-href ./`): con `useHash: true` la URL
    del documento es siempre la raíz, así que ninguna ruta profunda los rompe.
  -->
  <link rel="icon" type="image/png" sizes="512x512" href="assets/images/frc.png?v=2">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body class="mat-typography">
  <app-root></app-root>

  <!-- The core Firebase JS SDK is always required and must be listed first -->
<!-- <script src="https://www.gstatic.com/firebasejs/8.7.1/firebase-app.js"></script> -->

<!-- TODO: Add SDKs for Firebase products that you want to use
     https://firebase.google.com/docs/web/setup#available-libraries -->


</body>
</html>
