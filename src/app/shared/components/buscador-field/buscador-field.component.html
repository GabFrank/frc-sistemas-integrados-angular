<mat-form-field class="buscador-field" [appearance]="appearance" [class.solo-lectura]="!rapido" (click)="onClick()">
  <mat-label>{{ titulo }}</mat-label>
  <input #input matInput type="text" autocomplete="off"
    [formControl]="textoControl"
    [readonly]="!rapido"
    [required]="requerido"
    [placeholder]="placeholder || (rapido ? 'Id o nombre' : 'Click para buscar')"
    (input)="onInput()"
    (keyup.enter)="onEnter($event)"
    (blur)="onBlur()" />
  <mat-spinner matSuffix *ngIf="buscando" diameter="18"></mat-spinner>
  <button mat-icon-button matSuffix type="button" *ngIf="limpiable && valor && !disabled"
    (click)="onLimpiar($event)" matTooltip="Quitar selección">
    <mat-icon>close</mat-icon>
  </button>
  <button mat-icon-button matSuffix type="button" *ngIf="!disabled && !buscando"
    (click)="$event.stopPropagation(); abrir()" matTooltip="Abrir buscador">
    <mat-icon>search</mat-icon>
  </button>
  <mat-hint *ngIf="aviso" [class.aviso-error]="avisoError">{{ aviso }}</mat-hint>
</mat-form-field>
