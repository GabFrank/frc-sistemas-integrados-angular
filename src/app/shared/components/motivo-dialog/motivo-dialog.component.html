<app-dialogo-base class="motivo-dialog" [titulo]="data.titulo" [tono]="tono">
  <p class="mensaje">{{ data.mensaje }}</p>
  <p class="detalle" *ngIf="data.detalle">{{ data.detalle }}</p>
  <mat-form-field appearance="outline" class="campo">
    <mat-label>{{ etiqueta }}</mat-label>
    <textarea
      matInput
      rows="3"
      cdkFocusInitial
      [formControl]="motivoControl"
      (keydown.control.enter)="onConfirmar()"
    ></textarea>
    <mat-error>El motivo es obligatorio</mat-error>
  </mat-form-field>

  <div acciones>
    <button mat-flat-button class="frc-btn-cancelar" type="button" (click)="onVolver()">Volver</button>
    <button mat-flat-button class="frc-btn-confirmar" type="button" [disabled]="motivoControl.invalid" (click)="onConfirmar()">
      {{ data.botonConfirmar }}
    </button>
  </div>
</app-dialogo-base>
