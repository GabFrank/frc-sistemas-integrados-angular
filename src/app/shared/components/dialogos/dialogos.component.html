<app-dialogo-base [titulo]="data.title" [tono]="tono">
  <p class="mensaje" *ngIf="data?.message1 != null">{{ data.message1 }}</p>
  <p class="detalle" *ngIf="data?.message2 != null">{{ data.message2 }}</p>
  <ng-container *ngIf="data.listMessages?.length > 0">
    <p class="detalle" *ngIf="data.listMessages?.length === 1">{{ data.listMessages[0] }}</p>
    <ul *ngIf="data.listMessages?.length > 1">
      <li *ngFor="let mes of data.listMessages">{{ mes }}</li>
    </ul>
  </ng-container>

  <div acciones *ngIf="data.action">
    <button
      type="button"
      #okButton
      matDialogClose
      mat-flat-button
      class="frc-btn-confirmar"
      (keydown)="okKeydownEvent($event)"
      (click)="dialogRef.close(true)"
      autofocus
    >
      {{ data.btn1Name }}
    </button>

    <button
      type="button"
      #cancelButton
      matDialogClose
      mat-flat-button
      class="frc-btn-cancelar"
      (keydown)="cancelKeydownEvent($event)"
      (click)="dialogRef.close(false)"
    >
      {{ data.btn2Name }}
    </button>

    <button
      *ngIf="data.btn3Name"
      type="button"
      #cancelButton2
      matDialogClose
      mat-flat-button
      class="frc-btn-cancelar"
      (keydown)="cancel2KeydownEvent($event)"
      (click)="dialogRef.close(null)"
    >
      {{ data.btn3Name }}
    </button>
  </div>

  <div acciones *ngIf="!data.action">
    <button
      type="button"
      #okButton2
      matDialogClose
      mat-flat-button
      class="frc-btn-confirmar"
      (keydown)="okKeydownEvent($event)"
      (click)="dialogRef.close(false)"
      autofocus
    >
      Cerrar
    </button>
  </div>
</app-dialogo-base>
