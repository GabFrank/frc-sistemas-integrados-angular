<div class="frc-dialogo">
  <div class="frc-dialogo-header">
    <h2
      mat-dialog-title
      class="frc-dialogo-titulo"
    >
      {{ titulo }}
    </h2>
    <button
      *ngIf="botonCerrar"
      type="button"
      mat-icon-button
      class="frc-dialogo-cerrar"
      [mat-dialog-close]="null"
      aria-label="Cerrar"
      title="Cerrar"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div class="frc-dialogo-contenido">
    <ng-content></ng-content>
  </div>
  <div class="frc-dialogo-acciones">
    <ng-content select="[acciones]"></ng-content>
  </div>
</div>
