<div class="gl">
  <div class="gl-filtros">
    <div class="gl-filtros-campos">
      <ng-content select="[filtros]"></ng-content>
    </div>

    <div *ngIf="isMenu" class="gl-acciones">
      <ng-content select="[buscar]"></ng-content>
      <button
        type="button"
        mat-flat-button
        class="gl-btn gl-btn-buscar"
        [disabled]="disableFilter || bloqueados.buscar"
        [bdcWalkTriggerFor]="buscarTrigger"
        (click)="onFiltrar()"
      >
        <mat-icon>search</mat-icon>
        Buscar
      </button>
      <button
        type="button"
        mat-stroked-button
        class="gl-btn gl-btn-borde"
        [disabled]="bloqueados.limpiar"
        (click)="onResetFiltro()"
      >
        <mat-icon>filter_alt_off</mat-icon>
        Limpiar filtro
      </button>
      <button
        *ngIf="isAdicionar"
        type="button"
        mat-flat-button
        class="gl-btn gl-btn-adicionar"
        [disabled]="disableAdicionar || bloqueados.adicionar"
        (click)="onAdd()"
      >
        <mat-icon>add</mat-icon>
        Adicionar
      </button>
      <button
        *ngIf="isCustom"
        type="button"
        mat-stroked-button
        class="gl-btn gl-btn-borde"
        [disabled]="disableCustom || bloqueados.custom"
        (click)="onCustomFunc()"
      >
        {{ customName }}
      </button>
      <button
        *ngIf="isCustom2"
        type="button"
        mat-stroked-button
        class="gl-btn gl-btn-borde"
        [disabled]="disableCustom2 || bloqueados.custom2"
        (click)="onCustomFunc2()"
      >
        {{ customName2 }}
      </button>
    </div>
  </div>

  <div class="gl-tabla">
    <div class="gl-tabla-contenido">
      <ng-content select="[table]"></ng-content>
      <div *ngIf="data?.length > 0 && isCargarMas" class="gl-cargar-mas">
        <button mat-button color="accent" (click)="onCargarMasDatos()" [disabled]="isLastPage">
          CARGAR MAS
        </button>
      </div>
    </div>
  </div>
</div>
