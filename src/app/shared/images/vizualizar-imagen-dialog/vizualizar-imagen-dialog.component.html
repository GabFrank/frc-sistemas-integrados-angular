<div fxLayout="column" fxLayoutAlign="start center" style="width: 100%; height: 100%; text-align: center;">
  <div fxLlex>
    <img
      [src]="img"
      alt="imagen"
      style="width: 90%; height: 90%; object-fit: contain"
    />
  </div>
  <br>  
  <div fxFlex fxLayout="row" style="width: 100%;" fxLayoutAlign="space-around">
    <div [fxFlex]="esPresentacion ? '33%' : '50%'" style="text-align: center;">
      <button mat-raised-button color="primary" (click)="onCancelar()" style="width: 60%;">
        Cerrar
      </button>
    </div>
    <div *ngIf="esPresentacion" fxFlex="33%" style="text-align: center;">
      <button mat-stroked-button type="button" (click)="onBuscarEnInternet()" style="width: 60%;">
        <mat-icon>travel_explore</mat-icon>
        Buscar en internet
      </button>
    </div>
    <div [fxFlex]="esPresentacion ? '33%' : '50%'" style="text-align: center;">
      <button mat-raised-button color="accent" (click)="fileInput.click()" style="width: 60%;">
        Cambiar
      </button>
      <input
        #fileInput
        type="file"
        accept="image/*"
        (change)="onFileInput($event, data.entity?.id)"
        style="display: none"
      />
    </div>
  </div>
</div>
