<form [formGroup]="formGroup" fxLayout="column">
    <div style="width: 100%; text-align: center">
      <h2>Crear nueva Subfamilia</h2>
    </div>
    <div fxFlex fxLayout="row">
      <mat-form-field fxFlex>
        <mat-label>Nombre</mat-label>
        <input matInput type="text" formControlName="nombre" autocomplete="off"/>
      </mat-form-field>
    </div>
    <div fxFlex fxLayout="row">
      <mat-form-field fxFlex>
        <mat-label>Descripción</mat-label>
        <textarea matInput type="text" formControlName="descripcion" autocomplete="off"></textarea>
      </mat-form-field>
    </div>
    <div fxFlex fxLayout="row" fxLayoutAlign="start center">
      <mat-slide-toggle fxFlex="50" formControlName="activo">{{
        formGroup.controls.activo.value ? "Activo" : "Inactivo"
      }}</mat-slide-toggle>
      <div fxFlex fxLayout="row" fxLayoutAlign="start center">
          <div fxFlex>
              Icono: 
          </div>
          <mat-icon fxFlex style="font-size: 3em; height: 100%;">{{iconoControl.value}}</mat-icon>
          <button mat-raised-button color="primary">
              <mat-icon (click)="searchIcon()">search</mat-icon>
          </button>
      </div>
    </div>
    <div fxFlex>
      <mat-form-field>
        <mat-label>Posición</mat-label>
        <mat-select formControlName="posicion">
          <mat-option *ngFor="let pos of listPos" [value]="pos">
            {{pos}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <!-- Alta sin respuesta (#390): pudo haberse guardado; no se vuelve a guardar desde acá -->
    <div *ngIf="altaSinConfirmar" fxLayout="column" fxLayoutGap="8px" style="padding: 10px; border: 1px solid #ffb74d; border-radius: 6px; margin-bottom: 10px">
      <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="8px">
        <mat-icon>warning</mat-icon>
        <span>No se pudo confirmar si la subfamilia se guardó. No vuelvas a cargarla sin revisar: cerrá y buscala en la lista.</span>
      </div>
      <div fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="10px">
        <button mat-stroked-button type="button" (click)="onCerrar()">Cerrar</button>
      </div>
    </div>
    <br>
    <div fxFlex fxLayout="row" fxLayoutGap="20px" fxLayoutAlign="space-around center">
      <button fxFlex="30" *ngIf="isCancelar" mat-raised-button (click)="onCancelar()" color="primary">Cancelar</button>
      <button [disabled]="!formGroup.valid || guardando || altaSinConfirmar" fxFlex="30" *ngIf="isGuardar" mat-raised-button (click)="onGuardar()" color="accent">Guardar</button>
      <button fxFlex="30" *ngIf="isEditar" mat-raised-button (click)="onEditar()" color="accent">Editar</button>
  </div>
  </form>
