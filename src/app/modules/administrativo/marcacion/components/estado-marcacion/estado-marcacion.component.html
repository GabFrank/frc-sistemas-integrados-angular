<div class="estado-container">
    <div *ngIf="cargando" class="loading-container" fxLayout="column" fxLayoutAlign="center center">
        <mat-spinner diameter="50"></mat-spinner>
        <span class="loading-text">Verificando estado...</span>
    </div>

    <mat-card *ngIf="!cargando" class="estado-card" [ngClass]="estaEnJornada ? 'con-entrada' : 'sin-entrada'">
        <mat-card-content fxLayout="column" fxLayoutAlign="center center" fxLayoutGap="24px">
            <div fxLayout="column" fxLayoutAlign="center center" fxLayoutGap="16px" class="estado-content">
                <div *ngIf="mensajeErrorFoto" class="error-foto">
                    {{ mensajeErrorFoto }}
                </div>

                <div *ngIf="usuarioActualId && usuarioSeleccionado?.id && usuarioActualId !== usuarioSeleccionado.id"
                    class="aviso-tercero">
                    Debe presentarse el rostro de <strong>{{ usuarioSeleccionado?.persona?.nombre }}</strong>
                    (similitud mínima 75%).
                </div>

                <camara-reconocimiento *ngIf="mostrandoCamara" #camaraRef [modo]="modoCamara"
                    [referenciaGaleria]="referenciaGaleria" [usuarioSeleccionado]="usuarioSeleccionado"
                    [usuarioActualId]="usuarioActualId"
                    (identidadVerificada)="identidadVerificada.emit($event)"
                    (fotoPerfilGuardada)="fotoPerfilGuardada.emit()"
                    (similitudInsuficiente)="similitudInsuficiente.emit($event)">
                </camara-reconocimiento>

                <div *ngIf="!mostrandoCamara && !mensajeErrorFoto && !reconocimientoExitoso">
                    <button *ngIf="!estaEnJornada" mat-stroked-button color="primary"
                        (click)="iniciarReconocimiento.emit()">
                        <mat-icon>face</mat-icon> Intentar Reconocimiento
                    </button>
                    <button *ngIf="estaEnJornada" mat-stroked-button color="warn"
                        (click)="iniciarReconocimiento.emit()">
                        <mat-icon>face</mat-icon>
                        {{ accionPendiente === AccionMarcacionPendiente.RETORNO_ALMUERZO ? 'Verificar para Retorno' : 'Verificar para Salir' }}
                    </button>
                </div>

                <div *ngIf="reconocimientoExitoso" fxLayout="column" fxLayoutAlign="center center"
                    fxLayoutGap="16px" class="estado-content">
                    <div class="success-message">
                        <mat-icon>check_circle</mat-icon> Identidad Verificada
                    </div>
                    <button *ngIf="!estaEnJornada" mat-raised-button class="btn-entrada"
                        (click)="registrarEntrada.emit()">
                        <mat-icon>login</mat-icon>
                        REGISTRAR ENTRADA
                    </button>
                    <button *ngIf="estaEnJornada && accionPendiente === AccionMarcacionPendiente.RETORNO_ALMUERZO"
                        mat-raised-button class="btn-retorno-almuerzo" (click)="registrarRetornoAlmuerzo.emit()">
                        <mat-icon>restaurant</mat-icon>
                        REGISTRAR RETORNO ALMUERZO
                    </button>
                    <button *ngIf="estaEnJornada && (accionPendiente === AccionMarcacionPendiente.SALIDA
                        || accionPendiente === AccionMarcacionPendiente.SALIDA_DEFINITIVA)"
                        mat-raised-button class="btn-salida" (click)="registrarSalida.emit()">
                        <mat-icon>logout</mat-icon>
                        REGISTRAR SALIDA
                    </button>
                </div>
            </div>
        </mat-card-content>
    </mat-card>
</div>
