<div class="sorteo-dialog" fxLayout="column" fxLayoutGap="10px">
  <h3 class="titulo">Sorteo</h3>
  <div class="lineas">
    <div *ngFor="let linea of lineas">{{ linea }}</div>
  </div>
  <mat-form-field>
    <mat-label>RUC/CI del cliente</mat-label>
    <input
      #documentoInput
      matInput
      type="text"
      cdkFocusInitial
      autocomplete="off"
      [formControl]="documentoControl"
      (keydown.enter)="onEnterDocumento($event)"
    />
    <button mat-button matSuffix type="button" [disabled]="buscando" (click)="onBuscar()">Buscar</button>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Nombre</mat-label>
    <input
      #nombreInput
      matInput
      type="text"
      autocomplete="off"
      [formControl]="nombreControl"
      (keydown.enter)="onEnterNombre($event)"
    />
  </mat-form-field>
  <div class="estado">
    <mat-spinner *ngIf="buscando" diameter="30"></mat-spinner>
    <div *ngIf="!buscando && mensaje != null" class="mensaje">{{ mensaje }}</div>
  </div>
  <div fxLayout="row" fxLayoutGap="10px" fxLayoutAlign="end center">
    <button mat-stroked-button type="button" (click)="onNoParticipa()">No participa</button>
    <button mat-flat-button color="accent" type="button" [disabled]="buscando" (click)="onConfirmar()">
      Confirmar
    </button>
  </div>
</div>
