<div class="gasto-categoria-container">
  <div
    class="filtros-container"
    fxLayout="row"
    fxLayoutGap="12px"
    fxLayoutAlign="start center"
  >
    <mat-form-field appearance="outline">
      <mat-label>Sucursal</mat-label>
      <mat-select [formControl]="sucursalControl">
        <mat-option [value]="null">Todas las Sucursales</mat-option>
        <mat-option *ngFor="let sucursal of sucursales$ | async" [value]="sucursal.id">
          {{ sucursal.nombre }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <frc-grafico-filtros-fecha
      [mostrarDia]="false"
      (rangoChange)="onRangoFechaChange($event)"
    ></frc-grafico-filtros-fecha>

    <button
      mat-icon-button
      type="button"
      (click)="limpiarFiltros()"
      matTooltip="Limpiar filtros"
      aria-label="Limpiar filtros"
    >
      <mat-icon>filter_alt_off</mat-icon>
    </button>
  </div>

  <ng-container *ngIf="vista$ | async as vista">
    <frc-grafico-shell
      class="grafico-wrapper"
      titulo="Gastos por Categoría"
      [opciones]="vista.opciones"
      [cargando]="vista.cargando"
      [hayDatos]="vista.hayDatos"
      [datosListos]="vista.datosListos"
      alturaMinima="480px"
    ></frc-grafico-shell>
  </ng-container>
</div>
