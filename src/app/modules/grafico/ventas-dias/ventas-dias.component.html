<div class="ventas-dias-container">
  <div
    class="filtros-container"
    fxLayout="row"
    fxLayoutGap="12px"
    fxLayoutAlign="start center"
  >
    <mat-form-field appearance="outline">
      <mat-label>Sucursal</mat-label>
      <mat-select [formControl]="sucursalControl">
        <mat-option [value]="null">Todas las Sucursales</mat-option>
        <mat-option *ngFor="let sucursal of sucursales$ | async" [value]="sucursal.id">
          {{ sucursal.nombre }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <ng-container *ngIf="vista$ | async as vista">
    <frc-grafico-shell
      class="grafico-wrapper"
      titulo="Ventas por Hora del Día"
      [opciones]="vista.opciones"
      [cargando]="vista.cargando"
      [hayDatos]="vista.hayDatos"
      [datosListos]="vista.datosListos"
      alturaMinima="480px"
    ></frc-grafico-shell>
  </ng-container>
</div>
