<div class="venta-funcionario-layout grafico-pantalla">
  <div
    *ngIf="!modoExterno"
    class="grafico-filtros"
  >
    <mat-form-field
      appearance="outline"
      class="grafico-filtros__campo grafico-filtros__campo--sucursal"
    >
      <mat-label>Sucursales</mat-label>
      <mat-select
        [formControl]="filtroSucursales.control"
        multiple
        placeholder="Todas"
        (selectionChange)="filtroSucursales.onSeleccionChange($event.value, filtrar.bind(this))"
      >
        <mat-option [value]="filtroSucursales.todosValor">Todos</mat-option>
        <mat-option
          *ngFor="let s of sucursales$ | async"
          [value]="s.id"
        >
          {{ s.nombre }}
        </mat-option>
      </mat-select>
      <mat-icon matPrefix>store</mat-icon>
    </mat-form-field>

    <mat-form-field
      appearance="outline"
      class="grafico-filtros__campo grafico-filtros__campo--anho"
    >
      <mat-label>Años</mat-label>
      <mat-select [formControl]="filtroPeriodo.anhoControl" multiple>
        <mat-option
          *ngFor="let y of filtroPeriodo.anhos"
          [value]="y"
        >
          {{ y }}
        </mat-option>
      </mat-select>
      <mat-icon matPrefix>calendar_today</mat-icon>
    </mat-form-field>

    <mat-form-field
      appearance="outline"
      class="grafico-filtros__campo grafico-filtros__campo--mes"
    >
      <mat-label>Meses</mat-label>
      <mat-select
        [formControl]="filtroPeriodo.mesControl"
        multiple
        (selectionChange)="filtroPeriodo.onMesesChange($event.value)"
      >
        <mat-option
          *ngFor="let m of filtroPeriodo.meses"
          [value]="m.valor"
        >
          {{ m.nombre }}
        </mat-option>
      </mat-select>
      <mat-icon matPrefix>date_range</mat-icon>
    </mat-form-field>

    <mat-form-field
      appearance="outline"
      class="grafico-filtros__campo grafico-filtros__campo--rango filter-rango"
      [class.filter-rango--inactivo]="!filtroPeriodo.rangoDiasActivo"
    >
      <mat-label>Rango de días</mat-label>
      <mat-date-range-input
        [formGroup]="filtroPeriodo.fechaRangoGroup"
        [rangePicker]="pickerRango"
      >
        <input
          matStartDate
          formControlName="inicio"
          placeholder="Desde"
          [min]="filtroPeriodo.minFechaRango"
          [max]="filtroPeriodo.maxFechaRango"
        />
        <input
          matEndDate
          formControlName="fin"
          placeholder="Hasta"
          [min]="filtroPeriodo.minFechaRango"
          [max]="filtroPeriodo.maxFechaRango"
        />
      </mat-date-range-input>
      <mat-datepicker-toggle matSuffix [for]="pickerRango"></mat-datepicker-toggle>
      <mat-date-range-picker #pickerRango></mat-date-range-picker>
    </mat-form-field>

    <button
      mat-stroked-button
      type="button"
      class="grafico-filtros__btn-secundario"
      (click)="buscarFuncionario()"
      matTooltip="Buscar funcionario"
      aria-label="Buscar funcionario"
    >
      <mat-icon>person_search</mat-icon>
      Buscar Funcionario
    </button>

    <div
      *ngIf="funcionariosSeleccionados.length > 0"
      class="grafico-filtros__chips-row"
    >
      <span
        *ngFor="let usuario of funcionariosSeleccionados; let i = index"
        class="grafico-filtros__chip grafico-filtros__chip--accent"
      >
        {{ nombreFuncionario(usuario) }}
        <mat-icon
          class="chip-remove"
          (click)="quitarFuncionario(i)"
          matTooltip="Quitar funcionario"
        >
          close
        </mat-icon>
      </span>
    </div>

    <div class="grafico-filtros__acciones">
      <button
        mat-raised-button
        color="primary"
        type="button"
        (click)="filtrar()"
        [disabled]="cargando$ | async"
        aria-label="Aplicar filtros"
      >
        Filtrar
      </button>

      <button
        mat-icon-button
        type="button"
        class="grafico-filtros__limpiar"
        (click)="limpiarFiltros()"
        matTooltip="Limpiar filtros generales"
        aria-label="Limpiar filtros generales"
      >
        <mat-icon>filter_alt_off</mat-icon>
      </button>
    </div>
  </div>

  <ng-container *ngIf="vista$ | async as vista">
    <frc-grafico-shell
      class="venta-funcionario-layout__grafico"
      titulo="Ventas por Funcionario"
      [opciones]="vista.opciones"
      [cargando]="vista.cargando"
      [hayDatos]="vista.hayDatos"
      [datosListos]="vista.datosListos"
    ></frc-grafico-shell>
  </ng-container>
</div>
