<div class="venta-funcionario-layout">
  <!-- Filtros (ocultos en modo externo) -->
  <div
    *ngIf="!modoExterno"
    class="venta-funcionario-layout__filtros"
    fxLayout="row"
    fxLayoutGap="12px"
    fxLayoutAlign="start center"
  >
    <mat-form-field
      fxFlex="25%"
      appearance="outline"
    >
      <mat-label>Sucursales</mat-label>
      <mat-select
        [formControl]="sucursalControl"
        multiple
        placeholder="Todas"
      >
        <mat-option
          *ngFor="let s of sucursales$ | async"
          [value]="s.id"
        >
          {{ s.nombre }}
        </mat-option>
      </mat-select>
      <mat-icon matPrefix>store</mat-icon>
    </mat-form-field>

    <mat-form-field
      fxFlex="12%"
      appearance="outline"
    >
      <mat-label>Año</mat-label>
      <mat-select [formControl]="filtroPeriodo.anhoControl">
        <mat-option
          *ngFor="let y of filtroPeriodo.anhos"
          [value]="y"
        >
          {{ y }}
        </mat-option>
      </mat-select>
      <mat-icon matPrefix>calendar_today</mat-icon>
    </mat-form-field>

    <mat-form-field
      fxFlex="22%"
      appearance="outline"
    >
      <mat-label>Meses</mat-label>
      <mat-select
        [formControl]="filtroPeriodo.mesControl"
        multiple
        (selectionChange)="filtroPeriodo.onMesesChange($event.value)"
      >
        <mat-option
          *ngFor="let m of filtroPeriodo.meses"
          [value]="m.valor"
        >
          {{ m.nombre }}
        </mat-option>
      </mat-select>
      <mat-icon matPrefix>date_range</mat-icon>
    </mat-form-field>

    <mat-form-field
      *ngIf="filtroPeriodo.mostrarRangoDias"
      fxFlex="24%"
      appearance="outline"
      class="filter-rango"
    >
      <mat-label>Rango de días</mat-label>
      <mat-date-range-input
        [formGroup]="filtroPeriodo.fechaRangoGroup"
        [rangePicker]="pickerRango"
      >
        <input
          matStartDate
          formControlName="inicio"
          placeholder="Desde"
          [min]="filtroPeriodo.minFechaRango"
          [max]="filtroPeriodo.maxFechaRango"
        />
        <input
          matEndDate
          formControlName="fin"
          placeholder="Hasta"
          [min]="filtroPeriodo.minFechaRango"
          [max]="filtroPeriodo.maxFechaRango"
        />
      </mat-date-range-input>
      <mat-datepicker-toggle matSuffix [for]="pickerRango"></mat-datepicker-toggle>
      <mat-date-range-picker #pickerRango></mat-date-range-picker>
    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      type="button"
      (click)="filtrar()"
      [disabled]="cargando$ | async"
      aria-label="Aplicar filtros"
    >
      Filtrar
    </button>

    <button
      mat-icon-button
      type="button"
      (click)="limpiarFiltros()"
      matTooltip="Limpiar filtros generales"
      aria-label="Limpiar filtros generales"
    >
      <mat-icon>filter_alt_off</mat-icon>
    </button>

    <button
      mat-icon-button
      type="button"
      (click)="buscarFuncionario()"
      matTooltip="Buscar Funcionario específico"
      aria-label="Buscar Funcionario específico"
      [color]="colorBotonBuscarFuncionario"
    >
      <mat-icon>person_search</mat-icon>
    </button>

    <button
      *ngIf="mostrarBotonQuitarFuncionario"
      mat-icon-button
      type="button"
      (click)="limpiarFuncionario()"
      matTooltip="Quitar filtro de funcionario"
      aria-label="Quitar filtro de funcionario"
      color="warn"
    >
      <mat-icon>person_off</mat-icon>
    </button>
  </div>

  <ng-container *ngIf="vista$ | async as vista">
    <frc-grafico-shell
      class="venta-funcionario-layout__grafico"
      titulo="Ventas por Funcionario"
      [opciones]="vista.opciones"
      [cargando]="vista.cargando"
      [hayDatos]="vista.hayDatos"
      [datosListos]="vista.datosListos"
    ></frc-grafico-shell>
  </ng-container>
</div>
