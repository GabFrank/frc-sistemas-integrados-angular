<div class="venta-sucursal-layout">
  <div
    class="venta-sucursal-layout__filtros"
    fxLayout="row"
    fxLayoutGap="12px"
    fxLayoutAlign="start center"
  >
    <frc-grafico-filtros-fecha
      [etiquetaDia]="'Fecha Específica'"
      (rangoChange)="onRangoFechaChange($event)"
    ></frc-grafico-filtros-fecha>
  </div>

  <ng-container *ngIf="vista$ | async as vista">
    <frc-grafico-shell
      class="venta-sucursal-layout__grafico"
      titulo="Ventas por Sucursal"
      [opciones]="vista.opciones"
      [cargando]="vista.cargando"
      [hayDatos]="vista.hayDatos"
      [datosListos]="vista.datosListos"
      mensajeVacio="No hay datos para mostrar en este período"
      mensajeInicial="Seleccione filtros para visualizar datos"
    ></frc-grafico-shell>
  </ng-container>
</div>
