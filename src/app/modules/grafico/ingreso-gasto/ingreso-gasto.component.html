<div class="ingreso-gasto-layout">
  <div
    class="ingreso-gasto-layout__filtros"
    fxLayout="row"
    fxLayoutGap="12px"
    fxLayoutAlign="start center"
  >
    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Sucursal</mat-label>
      <mat-select [formControl]="sucursalControl">
        <mat-option [value]="null">Todas</mat-option>
        <mat-option *ngFor="let s of sucursales$ | async" [value]="s.id">
          {{ s.nombre }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="filter-field filter-field--anho">
      <mat-label>Año</mat-label>
      <mat-select [formControl]="yearControl">
        <mat-option *ngFor="let y of anhos" [value]="y">{{ y }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <ng-container *ngIf="vista$ | async as vista">
    <frc-grafico-shell
      class="ingreso-gasto-layout__grafico"
      titulo="Ingresos vs Gastos Mensual"
      [opciones]="vista.opciones"
      [cargando]="vista.cargando"
      [hayDatos]="vista.hayDatos"
      [datosListos]="vista.datosListos"
    ></frc-grafico-shell>
  </ng-container>
</div>
