<div class="ingreso-gasto-layout">
  <div
    class="ingreso-gasto-layout__filtros"
    fxLayout="row"
    fxLayoutGap="12px"
    fxLayoutAlign="start center"
  >
    <mat-form-field
      fxFlex="35%"
      appearance="outline"
      class="filter-field"
    >
      <mat-label>Sucursales</mat-label>
      <mat-select
        [formControl]="sucursalControl"
        multiple
        placeholder="Todas las sucursales"
      >
        <mat-option
          *ngFor="let s of sucursales$ | async"
          [value]="s.id"
        >
          {{ s.nombre }}
        </mat-option>
      </mat-select>
      <mat-icon matPrefix>store</mat-icon>
    </mat-form-field>

    <mat-form-field
      fxFlex="25%"
      appearance="outline"
      class="filter-field"
    >
      <mat-label>Años</mat-label>
      <mat-select
        [formControl]="yearControl"
        multiple
      >
        <mat-option
          *ngFor="let y of anhos"
          [value]="y"
        >
          {{ y }}
        </mat-option>
      </mat-select>
      <mat-icon matPrefix>calendar_today</mat-icon>
    </mat-form-field>

    <button
      mat-icon-button
      type="button"
      (click)="limpiarFiltros()"
      matTooltip="Limpiar filtros"
      aria-label="Limpiar filtros"
      class="clear-btn"
    >
      <mat-icon>filter_alt_off</mat-icon>
    </button>
  </div>

  <ng-container *ngIf="vista$ | async as vista">
    <frc-grafico-shell
      class="ingreso-gasto-layout__grafico"
      titulo="Ingresos vs Gastos Mensual"
      [opciones]="vista.opciones"
      [cargando]="vista.cargando"
      [hayDatos]="vista.hayDatos"
      [datosListos]="vista.datosListos"
    ></frc-grafico-shell>
  </ng-container>
</div>
