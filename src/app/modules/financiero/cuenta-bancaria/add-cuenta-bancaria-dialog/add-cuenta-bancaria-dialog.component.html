<div style="margin: 20px;">
<h2 class="titulo-center" style="font-weight: 500;">
  {{ isEditing ? 'Editar Cuenta Bancaria' : 'Nueva Cuenta Bancaria' }}
</h2>

<mat-dialog-content [formGroup]="formGroup" style="padding: 16px 0;">
  <div fxLayout="column" fxLayoutGap="14px">

    <mat-form-field style="width: 100%;">
      <mat-label class="required-field">Titular</mat-label>
      <input matInput [formControl]="buscarPersonaControl" readonly (click)="onBuscarPersona()" />
      <mat-icon class="icon" matSuffix (click)="onBuscarPersona()">search</mat-icon>
    </mat-form-field>
    <mat-error *ngIf="!selectedPersona" style="margin-top: -10px;">
      <h6>Debe seleccionar un titular</h6>
    </mat-error>

    <mat-form-field appearance="outline">
      <mat-label class="required-field">N° de Cuenta</mat-label>
      <input matInput [formControl]="numeroControl" />
      <mat-error *ngIf="numeroControl.hasError('required')">El número de cuenta es requerido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Banco</mat-label>
      <mat-select [formControl]="bancoControl">
        <mat-option *ngFor="let b of bancoList" [value]="b">{{ b.nombre }}</mat-option>
      </mat-select>
      <mat-error *ngIf="bancoControl.hasError('required')">Seleccione un banco</mat-error>
    </mat-form-field>

    <div fxLayout="row" fxLayoutGap="10px">
      <mat-form-field appearance="outline" fxFlex="50%">
        <mat-label>Moneda</mat-label>
        <mat-select [formControl]="monedaControl">
          <mat-option *ngFor="let m of monedaList" [value]="m">{{ m.denominacion }}</mat-option>
        </mat-select>
        <mat-error *ngIf="monedaControl.hasError('required')">Requerido</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" fxFlex="50%">
        <mat-label>Tipo de Cuenta</mat-label>
        <mat-select [formControl]="tipoCuentaControl">
          <mat-option *ngFor="let t of tipoCuentaList" [value]="t.value">{{ t.label }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="onCancel()">Cancelar</button>
  <button
    mat-raised-button
    color="primary"
    (click)="onSave()"
    [disabled]="formGroup.invalid || !selectedPersona || isSaving"
  >
    <mat-icon style="transform: scale(1.5);">save</mat-icon>
    Guardar
  </button>
</mat-dialog-actions>
</div>
