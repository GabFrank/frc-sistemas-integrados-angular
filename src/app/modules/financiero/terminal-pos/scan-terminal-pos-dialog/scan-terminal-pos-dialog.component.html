<div class="dialog-container" fxLayout="column" fxLayoutGap="10px">
  <h2 mat-dialog-title style="padding-left: 0;">Terminal POS</h2>
  <p style="margin: 0 0 8px; color: gray; font-size: 1.7rem;">
    Escanee o ingrese el código impreso en la terminal POS utilizada.
  </p>

  <form [formGroup]="formGroup" fxLayout="column" fxLayoutGap="15px" (ngSubmit)="onConfirmar()">
    <div fxLayout="row" fxLayoutGap="10px">
      <div fxFlex="100%">
        <mat-form-field appearance="outline" style="width: 100%;">
          <mat-label>Código de la terminal</mat-label>
          <input
            matInput
            [formControl]="codigoControl"
            required
            autofocus
            placeholder="Ej: POS-001"
          />
          <mat-error *ngIf="codigoControl.hasError('required')">
            El código es obligatorio
          </mat-error>
        </mat-form-field>
      </div>
    </div>

    <p *ngIf="buscando" style="margin: 0; color: gray; font-size: 1.4rem;">
      Buscando la terminal…
    </p>

    <mat-error *ngIf="noEncontrado" style="font-size: 0.9rem;">
      No se encontró ninguna terminal activa con ese código.
    </mat-error>
  </form>

  <div
    class="acciones"
    fxLayout="row"
    fxLayoutAlign="stretch center"
    fxLayoutGap="10px"
  >
    <!-- fxFlex sin valor (flex: 1 1 0) y no fxFlex="50": con el fxLayoutGap del contenedor,
         dos mitades exactas suman 100% + gap y una de las dos se desborda. Así los dos botones
         se reparten en partes iguales el ancho que queda después del gap. -->
    <button
      mat-raised-button
      class="btn-salir"
      fxFlex
      color="primary"
      (click)="onCancel()"
    >
      Cancelar
    </button>

    <!-- El diálogo antes sólo tenía Cancelar: si el lector no mandaba Enter, no había forma
         de confirmar el código ya tipeado. -->
    <button
      mat-raised-button
      class="btn-success"
      fxFlex
      [disabled]="codigoControl.invalid || buscando"
      (click)="onConfirmar()"
    >
      Confirmar
    </button>
  </div>
</div>
