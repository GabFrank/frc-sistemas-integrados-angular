<div class="verificar-dialog">

  <div class="ver-header">
    <h2 mat-dialog-title>{{ titulo }}</h2>
    <div class="subtitulo">{{ subtitulo }}</div>
  </div>

  <mat-dialog-content class="ver-content">
    <!-- Una tabla para todos los retiros: cada bloque aporta sus filas (una por moneda). Enter pasa al
         siguiente contado, también de un retiro al otro. -->
    <div class="tabla" [class.con-retiro]="retiros.length > 1" (keydown.enter)="siguienteContado($event)">
      <div class="th" *ngIf="retiros.length > 1">Retiro</div>
      <div class="th">Moneda</div>
      <div class="th num">Declarado</div>
      <div class="th num">Contado</div>
      <div class="th">Diferencia</div>
      <div class="th"></div>
      <app-verificar-retiro-bloque *ngFor="let r of retiros; trackBy: porId" [retiro]="r"
                                   [conEncabezado]="retiros.length > 1"></app-verificar-retiro-bloque>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="ver-actions">
    <!-- Cerrar a mitad cortaría la secuencia con un retiro en vuelo. -->
    <button mat-button (click)="onCancelar()" [disabled]="guardando">Cancelar</button>
    <span class="spacer"></span>
    <button mat-raised-button color="primary" (click)="onConfirmar()" [disabled]="guardando || sinConfirmar">
      <mat-icon>check</mat-icon> {{ retiros.length > 1 ? 'Confirmar e ingresar los ' + retiros.length : 'Confirmar e ingresar' }}
    </button>
  </mat-dialog-actions>
</div>
