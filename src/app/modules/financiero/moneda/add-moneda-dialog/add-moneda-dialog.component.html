<div style="margin: 20px; min-width: 360px;">
<h2 class="titulo-center" style="font-weight: 500;">{{ isEditing ? 'Editar Moneda' : 'Nueva Moneda' }}</h2>

<mat-dialog-content [formGroup]="formGroup" style="padding: 16px 0;">
  <div fxLayout="column" fxLayoutGap="12px">

    <div fxLayout="row" fxLayoutGap="10px">
      <mat-form-field appearance="outline" fxFlex="65%">
        <mat-label class="required-field">Denominación</mat-label>
        <input matInput [formControl]="denominacionControl" placeholder="Ej: GUARANI" />
        <mat-error *ngIf="denominacionControl.hasError('required')">Requerido</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" fxFlex="35%">
        <mat-label class="required-field">Símbolo</mat-label>
        <input matInput [formControl]="simboloControl" placeholder="Gs." />
        <mat-error *ngIf="simboloControl.hasError('required')">Requerido</mat-error>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Decimales</mat-label>
      <input matInput type="number" [formControl]="decimalesControl" />
      <mat-hint>0 para Gs, 2 para USD/BRL</mat-hint>
    </mat-form-field>

    <div fxLayout="row" fxLayoutGap="10px">
      <mat-form-field appearance="outline" fxFlex="55%">
        <mat-label>Regla de redondeo</mat-label>
        <mat-select [formControl]="reglaRedondeoControl">
          <mat-option *ngFor="let r of reglaList" [value]="r.value">{{ r.label }}</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline" fxFlex="45%" *ngIf="reglaRedondeoControl.value === 'MULTIPLO'">
        <mat-label>Múltiplo</mat-label>
        <input matInput type="number" [formControl]="redondeoMultiploControl" placeholder="50" />
      </mat-form-field>
    </div>

    <div fxLayout="row" fxLayoutGap="20px" style="margin-top: 4px;">
      <mat-slide-toggle [formControl]="activoControl">Activa</mat-slide-toggle>
      <mat-slide-toggle [formControl]="principalControl"
                        matTooltip="Moneda base del sistema (a lo sumo una)">
        Moneda principal
      </mat-slide-toggle>
    </div>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="formGroup.invalid || isSaving">
    <mat-icon>save</mat-icon> Guardar
  </button>
</mat-dialog-actions>
</div>
