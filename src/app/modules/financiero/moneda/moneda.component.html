<app-generic-list
  titulo="Monedas"
  style="height: 100%"
  [isAdicionar]="puedeGestionar"
  (adicionar)="onAdd()"
  [disableFilter]="true">

  <div table style="height: 100%" fxLayout="column" fxLayoutAlign="space-between start">
    <table mat-table [dataSource]="dataSource" style="width: 100%;">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef style="text-align: center;">ID</th>
        <td mat-cell *matCellDef="let row" style="text-align: center;">{{ row.id }}</td>
      </ng-container>

      <ng-container matColumnDef="denominacion">
        <th mat-header-cell *matHeaderCellDef style="text-align: center;">Denominación</th>
        <td mat-cell *matCellDef="let row" style="text-align: center;">{{ row.denominacion }}</td>
      </ng-container>

      <ng-container matColumnDef="simbolo">
        <th mat-header-cell *matHeaderCellDef style="text-align: center;">Símbolo</th>
        <td mat-cell *matCellDef="let row" style="text-align: center;">{{ row.simbolo }}</td>
      </ng-container>

      <ng-container matColumnDef="decimales">
        <th mat-header-cell *matHeaderCellDef style="text-align: center;">Decimales</th>
        <td mat-cell *matCellDef="let row" style="text-align: center;">{{ row.decimales != null ? row.decimales : '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="principal">
        <th mat-header-cell *matHeaderCellDef style="text-align: center;">Principal</th>
        <td mat-cell *matCellDef="let row" style="text-align: center;">
          <mat-icon *ngIf="row.principal" style="color: #4caf50;">star</mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="activo">
        <th mat-header-cell *matHeaderCellDef style="text-align: center;">Estado</th>
        <td mat-cell *matCellDef="let row" style="text-align: center;">
          <mat-icon [style.color]="row.activo !== false ? '#4caf50' : '#f44336'">
            {{ row.activo !== false ? 'check_circle' : 'cancel' }}
          </mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef style="text-align: center;">Acciones</th>
        <td mat-cell *matCellDef="let row" style="text-align: center;">
          <button mat-icon-button [matMenuTriggerFor]="menu">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="onEdit(row)" [disabled]="!puedeGestionar">
              <mat-icon>edit</mat-icon><span>Editar</span>
            </button>
            <button mat-menu-item (click)="onDelete(row)" [disabled]="!puedeGestionar">
              <mat-icon>delete</mat-icon><span>Eliminar</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</app-generic-list>
