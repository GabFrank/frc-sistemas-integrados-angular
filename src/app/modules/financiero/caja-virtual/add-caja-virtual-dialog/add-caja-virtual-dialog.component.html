<h2 mat-dialog-title class="titulo-center" style="font-weight: 500;">
  {{ isEditing ? 'Editar Caja Virtual' : 'Nueva Caja Virtual' }}
</h2>

<mat-dialog-content [formGroup]="formGroup" style="padding: 16px 0;">
  <div fxLayout="column" fxLayoutGap="12px">

    <mat-form-field appearance="outline">
      <mat-label>Nombre *</mat-label>
      <input matInput [formControl]="nombreControl" id="input-nombre" placeholder="Ej: CAJA MAYOR CENTRAL" />
      <mat-error *ngIf="nombreControl.hasError('required')">El nombre es requerido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tipo *</mat-label>
      <mat-select [formControl]="tipoControl" id="select-tipo">
        <mat-option *ngFor="let t of tipoList" [value]="t.value">{{ t.label }}</mat-option>
      </mat-select>
      <mat-error *ngIf="tipoControl.hasError('required')">El tipo es requerido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" *ngIf="tipoControl.value === 'CAJA_CHICA'">
      <mat-label>Límite en Gs. (opcional)</mat-label>
      <input matInput type="number" [formControl]="limiteGsControl" id="input-limite-gs"
             placeholder="Monto máximo autorizado" />
      <span matSuffix>Gs.</span>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Descripción</mat-label>
      <textarea matInput [formControl]="descripcionControl" id="input-descripcion"
                rows="3" placeholder="Descripción opcional de la caja"></textarea>
    </mat-form-field>

    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="8px">
      <mat-slide-toggle [formControl]="activoControl" id="toggle-activo" color="primary">
        {{ activoControl.value ? 'Activa' : 'Inactiva' }}
      </mat-slide-toggle>
    </div>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="onCancel()" id="btn-cancelar">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSave()"
          [disabled]="formGroup.invalid || isSaving" id="btn-guardar">
    <mat-icon *ngIf="isSaving">
      <mat-spinner diameter="18" style="display: inline-block;"></mat-spinner>
    </mat-icon>
    <mat-icon *ngIf="!isSaving">save</mat-icon>
    {{ isEditing ? 'Actualizar' : 'Guardar' }}
  </button>
</mat-dialog-actions>
