<div class="carga-manual" [formGroup]="formGroup" fxLayout="column" fxLayoutGap="10px">

  <div class="cabecera">
    <h2 class="titulo-dialog">Cargar el cupón a mano</h2>
    <div class="subtitulo-dialog" *ngIf="data.terminalDescripcion">{{ data.terminalDescripcion }}</div>
  </div>

  <div class="monto-cobrado" *ngIf="data.monto != null">
    Cobrado: <b>{{ data.monedaSimbolo }} {{ data.monto | number }}</b>
  </div>

  <p class="ayuda">
    Copiá los datos del ticket. Los campos marcados con * son los que este aparato necesita para
    que la operación sirva.
  </p>

  <mat-form-field appearance="outline" *ngFor="let c of campos">
    <mat-label>{{ c.etiqueta }}{{ c.obligatorio ? ' *' : '' }}</mat-label>
    <input matInput [formControlName]="c.clave" autocomplete="off" />
  </mat-form-field>

  <div class="error-lectura" *ngIf="error">{{ error }}</div>

  <div fxLayout="row" fxLayoutAlign="center" fxLayoutGap="10px" class="acciones">
    <button mat-raised-button class="btn-salir" (click)="onCancelar()">Cancelar</button>
    <button mat-raised-button class="btn-success"
      [disabled]="formGroup.invalid || guardando" (click)="onGuardar()">
      {{ guardando ? 'Registrando…' : 'Registrar' }}
    </button>
  </div>

</div>
