<div class="dash-container">

  <!-- Header -->
  <div class="dash-header">
    <div class="dash-header-title">
      <h1 class="dash-title">Financiero</h1>
      <span class="dash-subtitle">Panel de control financiero</span>
    </div>
    <div class="dash-header-actions">
      <button mat-icon-button [disabled]="cargando" matTooltip="Actualizar" (click)="cargar()">
        <mat-icon>refresh</mat-icon>
      </button>
    </div>
  </div>

  <!-- KPIs -->
  <div class="dash-stats-row">
    <dash-stat-chip
      *ngFor="let kpi of kpis"
      [icon]="kpi.icon"
      [color]="kpi.color"
      [label]="kpi.label"
      [value]="kpi.value"
      [loading]="cargando"
    ></dash-stat-chip>
  </div>

  <!-- Accesos rápidos -->
  <div class="dash-quick-actions">
    <dash-quick-action
      *ngFor="let a of accesos"
      [icon]="a.icon"
      [title]="a.title"
      [color]="a.color"
      (action)="onAcceso(a.accion)"
    ></dash-quick-action>
  </div>

  <!-- Contenido -->
  <div class="dash-main">
    <!-- Gráfico (izquierda) -->
    <div class="dash-col">
      <dash-chart-card
        icon="bar_chart"
        title="Saldo por moneda (efectivo vs banco)"
        [opciones]="serieOpciones"
        [cargando]="cargando"
        [hayDatos]="serieHayDatos"
        alturaMinima="320px"
      ></dash-chart-card>
    </div>

    <!-- Cajas (compacto) + Próximos vencimientos (derecha) -->
    <div class="dash-col">
      <div class="dash-card">
        <div class="dash-section-header">
          <mat-icon>account_balance_wallet</mat-icon>
          <span class="dash-section-title">Cajas</span>
        </div>
        <div *ngIf="!cajaCards.length" class="dash-empty">
          <mat-icon>info</mat-icon>
          <span>No hay cajas activas</span>
        </div>
        <div class="dash-ranking-list" *ngIf="cajaCards.length">
          <div
            *ngFor="let c of cajaCards"
            class="dash-ranking-item"
            matTooltip="Abrir caja"
            (click)="abrirCaja(c.caja)"
          >
            <div class="dash-ranking-info">
              <div class="dash-ranking-name-row">
                <span class="dash-ranking-name">{{ c.caja.nombre }}</span>
                <span class="dash-ranking-secondary">{{ c.saldoLabel }}</span>
              </div>
            </div>
            <mat-icon style="opacity: 0.5;">open_in_new</mat-icon>
          </div>
        </div>
      </div>

      <dash-ranking-list
        icon="event"
        title="Próximos vencimientos (30 días)"
        [items]="vencimientoItems"
        emptyText="Sin vencimientos próximos"
        maxAlto="300px"
      ></dash-ranking-list>
    </div>
  </div>
</div>
