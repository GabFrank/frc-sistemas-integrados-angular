<h2 mat-dialog-title>{{ esEdicion ? 'Editar chequera' : 'Nueva chequera' }}</h2>

<mat-dialog-content [formGroup]="formGroup" class="form">
  <mat-form-field appearance="outline" class="full">
    <mat-label>Cuenta bancaria</mat-label>
    <mat-select [formControl]="cuentaControl">
      <mat-option *ngFor="let c of cuentas" [value]="c">
        {{ c.banco?.nombre }} · {{ c.numero }} ({{ c.moneda?.simbolo }})
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Nombre (opcional)</mat-label>
    <input matInput [formControl]="nombreControl" maxlength="80" />
  </mat-form-field>

  <div class="row">
    <mat-form-field appearance="outline">
      <mat-label>Rango desde</mat-label>
      <input matInput type="number" [formControl]="rangoDesdeControl" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Rango hasta</mat-label>
      <input matInput type="number" [formControl]="rangoHastaControl" />
    </mat-form-field>
  </div>

  <div class="row">
    <mat-form-field appearance="outline">
      <mat-label>Siguiente número</mat-label>
      <input matInput type="number" [formControl]="siguienteControl" />
      <mat-hint>Vacío = arranca desde "desde"</mat-hint>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Estado</mat-label>
      <mat-select [formControl]="estadoControl">
        <mat-option *ngFor="let e of estados" [value]="e.value">{{ e.label }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="isSaving">
    <mat-icon>save</mat-icon> Guardar
  </button>
</mat-dialog-actions>
