<div class="edit-chequera-dialog">
  <h2 class="titulo-center" style="font-weight: 500;">{{ esEdicion ? 'Editar chequera' : 'Nueva chequera' }}</h2>

  <mat-dialog-content [formGroup]="formGroup" style="padding: 16px 0;">
    <div fxLayout="column" fxLayoutGap="14px">

      <mat-form-field appearance="outline">
        <mat-label>Cuenta bancaria</mat-label>
        <mat-select [formControl]="cuentaControl">
          <mat-option *ngFor="let c of cuentas" [value]="c">
            {{ c.banco?.nombre }} · {{ c.numero }} ({{ c.moneda?.simbolo }})
          </mat-option>
        </mat-select>
        <mat-error *ngIf="cuentaControl.hasError('required')">Seleccione una cuenta</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="uppercase">
        <mat-label>Nombre (opcional)</mat-label>
        <input matInput [formControl]="nombreControl" maxlength="80" />
      </mat-form-field>

      <div fxLayout="row" fxLayoutGap="12px">
        <mat-form-field appearance="outline" fxFlex>
          <mat-label>Rango desde</mat-label>
          <input matInput type="number" [formControl]="rangoDesdeControl" />
          <mat-error *ngIf="rangoDesdeControl.hasError('required')">Requerido</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" fxFlex>
          <mat-label>Rango hasta</mat-label>
          <input matInput type="number" [formControl]="rangoHastaControl" />
          <mat-error *ngIf="rangoHastaControl.hasError('required')">Requerido</mat-error>
        </mat-form-field>
      </div>

      <div fxLayout="row" fxLayoutGap="12px">
        <mat-form-field appearance="outline" fxFlex>
          <mat-label>Siguiente número</mat-label>
          <input matInput type="number" [formControl]="siguienteControl" />
          <mat-hint>Vacío = arranca desde "desde"</mat-hint>
        </mat-form-field>
        <mat-form-field appearance="outline" fxFlex>
          <mat-label>Estado</mat-label>
          <mat-select [formControl]="estadoControl">
            <mat-option *ngFor="let e of estados" [value]="e.value">{{ e.label }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onCancel()">Cancelar</button>
    <button mat-raised-button color="primary" (click)="onSave()" [disabled]="isSaving">
      <mat-icon>save</mat-icon> Guardar
    </button>
  </mat-dialog-actions>
</div>
