<div mat-dialog-title>
  <div fxLayout="row" fxLayoutAlign="start center">
    <span class="titulo">REGISTRAR NUEVO TIPO DE EQUIPO</span>
  </div>
</div>

<mat-divider style="opacity: 0.1;"></mat-divider>

<mat-dialog-content style="min-width: 500px; padding-top: 20px;">
  <div fxLayout="column" fxLayoutGap="20px">
    <div class="form-section">
      <h3 class="section-title">REGISTRE EL NUEVO TIPO</h3>
      <form
        [formGroup]="tipoForm"
        fxLayout="row"
        fxLayoutAlign="start center"
        fxLayoutGap="15px"
      >
        <mat-form-field appearance="outline" fxFlex>
          <mat-label>Nombre del Tipo</mat-label>
          <input
            matInput
            formControlName="descripcion"
            placeholder="Ej: INFORMATICA"
            (keyup.enter)="onGuardarTipo()"
          >
        </mat-form-field>
      </form>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions fxLayout="row" fxLayoutAlign="end center" style="padding: 15px 24px;">
  <button
    mat-button
    (click)="onCancelar()"
    style="margin-right: 10px;"
  >
    CANCELAR
  </button>
  <button
    mat-raised-button
    color="accent"
    [disabled]="tipoForm.invalid"
    (click)="onGuardarTipo()"
  >
    <mat-icon>save</mat-icon>
    GUARDAR Y SELECCIONAR
  </button>
</mat-dialog-actions>
