<form [formGroup]="formGroup" class="persona-form" fxLayout="column" fxLayoutGap="8px">
  <h3 class="titulo">
    {{ selectedPersona == null ? "Nueva Persona" : (selectedPersona.nombre | titlecase) }}
  </h3>

  <div fxLayout="row" fxLayoutGap="16px">
    <div class="col-nombre" fxLayout="column">
      <mat-form-field class="form-element">
        <mat-label class="required-field">Nombre</mat-label>
        <input matInput formControlName="nombre" class="required-field" (keyup.enter)="apodo.focus()"/>
      </mat-form-field>
      <span *ngIf="!formGroup.controls['nombre'].valid && formGroup.controls['nombre'].touched" class="error">
        Este campo es obligatorio.
      </span>
    </div>
    <div fxFlex fxLayout="column">
      <mat-form-field class="form-element">
        <mat-label class="required-field">Nickname</mat-label>
        <input #apodo matInput formControlName="apodo" (keyup.enter)="documento.focus()"/>
      </mat-form-field>
    </div>
  </div>

  <div fxLayout="row" fxLayoutGap="16px">
    <div fxFlex fxLayout="column">
      <mat-form-field class="form-element">
        <mat-label class="required-field">C.I / RUC</mat-label>
        <input #documento matInput formControlName="documento" class="required-field" (keyup.enter)="telefono.focus()"/>
      </mat-form-field>
      <span *ngIf="!formGroup.controls['documento'].valid && formGroup.controls['documento'].touched" class="error">
        Este campo es obligatorio.
      </span>
    </div>
    <div fxFlex fxLayout="column">
      <mat-form-field class="form-element">
        <mat-label class="required-field">Teléfono</mat-label>
        <input #telefono matInput formControlName="telefono" (keyup.enter)="direccion.focus()"/>
      </mat-form-field>
      <span *ngIf="!formGroup.controls['telefono'].valid && formGroup.controls['telefono'].touched" class="error">
        Número de teléfono no válido.
      </span>
    </div>
  </div>

  <mat-form-field class="form-element">
    <mat-label>Dirección</mat-label>
    <input #direccion matInput formControlName="direccion" (keyup.enter)="nacimiento.focus()"/>
  </mat-form-field>

  <div fxLayout="row" fxLayoutGap="16px">
    <mat-form-field fxFlex>
      <mat-label>Fecha de nacimiento</mat-label>
      <input
        #nacimiento
        matInput
        [matDatepicker]="picker"
        [max]="maxDate"
        (dateChange)="onFechaNacimienntoChange($event)"
        formControlName="nacimiento"
        (keyup.enter)="email.focus()"
      />
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
    <mat-form-field fxFlex class="form-element">
      <mat-label>Email</mat-label>
      <input #email matInput class="email-input" formControlName="email" (input)="onEmailInput($event)" (keyup.enter)="guardar.focus()"/>
    </mat-form-field>
  </div>

  <div class="acciones" fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="16px">
    <button mat-raised-button color="primary" type="button" (click)="onCancel()">Cancelar</button>
    <button
      #guardar
      mat-raised-button
      color="accent"
      [disabled]="!formGroup.valid"
      type="button"
      (click)="onSave()"
    >
      Guardar
    </button>
  </div>
</form>
