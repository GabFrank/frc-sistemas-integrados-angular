<app-generic-list
  titulo="Lista de roles"
  (adicionar)="onAddOrEdit()"
  (filtrar)="onFilter()"
  (resetFiltro)="onResetFiltro()"
  [isAdicionar]="true"
>
  <div filtros>
    <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="10px">
      <div fxFlex="30%">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="ancho-90">
          <mat-label>Buscar por id o nombre</mat-label>
          <input
            type="text"
            matInput
            [formControl]="nombreControl"
            (keyup.enter)="onFilter()"
            autocomplete="off"
          />
        </mat-form-field>
      </div>
    </div>
  </div>
  <div table class="roles-tabla" fxLayout="column">
    <div class="roles-scroll" fxFlex>
    <table
      mat-table
      [dataSource]="pag.items$"
      multiTemplateDataRows
      class="mat-elevation-z8 ancho-100"
    >
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef class="texto-centro">Id</th>
        <td mat-cell *matCellDef="let role" class="texto-centro">
          {{ role.id }}
        </td>
      </ng-container>

      <!-- Name Column -->

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef class="texto-centro">
          Nombre
        </th>
        <td mat-cell *matCellDef="let role" class="texto-centro">
          {{ role?.nombre | uppercase }}
        </td>
      </ng-container>

      <ng-container matColumnDef="creadoEn">
        <th mat-header-cell *matHeaderCellDef class="texto-centro">
          Creado en
        </th>
        <td mat-cell *matCellDef="let role" class="texto-centro">
          {{ role?.creadoEn | date: "short" }}
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th
          mat-header-cell
          *matHeaderCellDef
          class="ancho-5 texto-centro"
        >
          ...
        </th>
        <td
          mat-cell
          *matCellDef="let role; let i = dataIndex"
          class="texto-centro ancho-5"
        >
          <button
            mat-icon-button
            [matMenuTriggerFor]="menu"
            (click)="$event.stopPropagation()"
          >
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="onAddOrEdit(role, i)"><mat-icon>edit</mat-icon><span>Editar</span></button>
            <button
              mat-menu-item
              color="primary"
              (click)="onDelete(role, i)"
            >
              <mat-icon>delete</mat-icon>
              <span>Eliminar</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>

      <mat-divider></mat-divider>

      <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
      <ng-container matColumnDef="expandedDetail">
        <td
          mat-cell
          *matCellDef="let role; let i = dataIndex"
          [attr.colspan]="displayedColumns.length"
          style="padding: 0px !important"
        >
          <div
            class="example-element-detail"
            [@detailExpand]="role == expandedElement ? 'expanded' : 'collapsed'"
          >
            <div
              fxLayout="row"
              class="ancho-100 relleno-aba-20"
              fxLayoutGap="20px"
              fxLayoutAlign="center center"
            >
              
            </div>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let element; columns: displayedColumns"
        class="example-element-row"
        [class.example-expanded-row]="expandedElement === element"
        [class.heightLight]="expandedElement === element"
        (click)="
          expandedElement = expandedElement === element ? null : element;
        "
      ></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: ['expandedDetail']"
        class="example-detail-row"
      ></tr>
    </table>
    </div>
    <mat-paginator
      class="roles-footer"
      fxFlex="none"
      [paginacion]="pag"
    ></mat-paginator>
  </div>
</app-generic-list>
