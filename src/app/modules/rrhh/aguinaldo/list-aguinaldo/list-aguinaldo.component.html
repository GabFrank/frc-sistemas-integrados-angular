<div class="aguinaldo-container" fxLayout="column" fxLayoutGap="12px">

  <div class="header" fxLayout="row" fxLayoutAlign="space-between center">
    <h2>Aguinaldos</h2>
  </div>

  <div class="filtros" fxLayout="row wrap" fxLayoutGap="10px" fxLayoutAlign="start center">
    <mat-form-field fxFlex="120px">
      <mat-label>Año</mat-label>
      <input matInput type="number" [formControl]="anioControl" />
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="onBuscar()">
      <mat-icon>search</mat-icon> Buscar
    </button>
    <button mat-stroked-button color="accent" (click)="onCalcular()">
      <mat-icon>calculate</mat-icon> Calcular año
    </button>
  </div>

  <div class="tabla-container">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">
      <ng-container matColumnDef="funcionario">
        <th mat-header-cell *matHeaderCellDef>Funcionario</th>
        <td mat-cell *matCellDef="let row">{{ row.funcionario?.persona?.nombre }}</td>
      </ng-container>
      <ng-container matColumnDef="mesesTrabajados">
        <th mat-header-cell *matHeaderCellDef>Meses</th>
        <td mat-cell *matCellDef="let row">{{ row.mesesTrabajados }}</td>
      </ng-container>
      <ng-container matColumnDef="montoCalculado">
        <th mat-header-cell *matHeaderCellDef>Monto</th>
        <td mat-cell *matCellDef="let row">{{ row.montoCalculado | number:'1.0-2' }}</td>
      </ng-container>
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let row">{{ row.estado }}</td>
      </ng-container>
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="primary" *ngIf="row.estado === 'CALCULADO'" (click)="onAprobar(row)" matTooltip="Aprobar"><mat-icon>check</mat-icon></button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
