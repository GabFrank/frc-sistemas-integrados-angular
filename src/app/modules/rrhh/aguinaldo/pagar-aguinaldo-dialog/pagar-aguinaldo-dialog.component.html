<h2 mat-dialog-title>Pagar aguinaldo</h2>

<div mat-dialog-content>
  <p *ngIf="data.nombre"><b>{{ data.nombre }}</b></p>
  <mat-form-field style="width: 100%">
    <mat-label>Caja Mayor</mat-label>
    <mat-select [formControl]="cajaControl">
      <mat-option *ngFor="let c of cajas" [value]="c.id">{{ c.nombre }}</mat-option>
    </mat-select>
  </mat-form-field>
  <p class="hint">El aguinaldo se paga por separado (egreso de Caja Mayor) y deja de sumarse en la liquidación mensual.</p>
</div>

<div mat-dialog-actions fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="10px">
  <button mat-button (click)="onCancelar()">Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="pagando" (click)="onPagar()">
    {{ pagando ? 'Pagando…' : 'Pagar' }}
  </button>
</div>
