<div class="justificativo-container" fxLayout="column" fxLayoutGap="12px">

  <div class="header" fxLayout="row" fxLayoutAlign="space-between center">
    <h2>Justificativos</h2>
    <button mat-raised-button color="primary" (click)="onNueva()">
      <mat-icon>add</mat-icon> Nueva
    </button>
  </div>

  <div class="filtros" fxLayout="row wrap" fxLayoutGap="10px" fxLayoutAlign="start center">
    <div fxFlex="380px">
      <app-select-funcionario
        [funcionarioId]="funcionarioControl.value"
        (idSelected)="funcionarioControl.setValue($event)">
      </app-select-funcionario>
    </div>

    <mat-form-field fxFlex="150px">
      <mat-label>Desde</mat-label>
      <input matInput [matDatepicker]="dp1" [formControl]="desdeControl" />
      <mat-datepicker-toggle matSuffix [for]="dp1"></mat-datepicker-toggle>
      <mat-datepicker #dp1></mat-datepicker>
    </mat-form-field>

    <mat-form-field fxFlex="150px">
      <mat-label>Hasta</mat-label>
      <input matInput [matDatepicker]="dp2" [formControl]="hastaControl" />
      <mat-datepicker-toggle matSuffix [for]="dp2"></mat-datepicker-toggle>
      <mat-datepicker #dp2></mat-datepicker>
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="onBuscar()">
      <mat-icon>search</mat-icon> Buscar
    </button>
  </div>

  <div class="tabla-container">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">

      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let row">{{ row.fecha | date:'dd/MM/yyyy' }}</td>
      </ng-container>

      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef>Tipo</th>
        <td mat-cell *matCellDef="let row">{{ row.tipo?.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="observacion">
        <th mat-header-cell *matHeaderCellDef>Observación</th>
        <td mat-cell *matCellDef="let row" class="text-left">{{ row.observacion }}</td>
      </ng-container>

      <ng-container matColumnDef="registradoPor">
        <th mat-header-cell *matHeaderCellDef>Registrado por</th>
        <td mat-cell *matCellDef="let row">{{ row.registradoPor?.nickname }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="primary" (click)="onEditar(row)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="onEliminar(row)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
