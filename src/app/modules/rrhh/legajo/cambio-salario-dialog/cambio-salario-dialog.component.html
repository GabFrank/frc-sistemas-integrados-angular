<div class="dialog-container" fxLayout="column" fxLayoutGap="12px">
  <h2 mat-dialog-title>Cambiar salario</h2>

  <div fxLayout="row" fxLayoutGap="10px">
    <mat-form-field fxFlex="60%">
      <mat-label>Nuevo salario</mat-label>
      <input matInput type="number" [formControl]="salarioControl" required />
      <mat-hint *ngIf="salarioMinimo != null">Mínimo legal: {{ salarioMinimo | number:'1.0-0' }}</mat-hint>
      <mat-error *ngIf="salarioControl.hasError('required')">Ingrese el salario</mat-error>
    </mat-form-field>
    <mat-form-field fxFlex="40%">
      <mat-label>Moneda</mat-label>
      <mat-select [formControl]="monedaControl">
        <mat-option *ngFor="let m of monedas" [value]="m.id">{{ m.denominacion }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <mat-form-field style="width: 100%">
    <mat-label>Fecha de vigencia</mat-label>
    <input matInput [matDatepicker]="picker" [formControl]="fechaControl" />
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <mat-form-field style="width: 100%">
    <mat-label>Motivo</mat-label>
    <input matInput [formControl]="motivoControl" />
  </mat-form-field>

  <div mat-dialog-actions fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="10px">
    <button mat-stroked-button (click)="onCancelar()">Cancelar</button>
    <button mat-raised-button color="primary" (click)="onGuardar()">Guardar</button>
  </div>
</div>
