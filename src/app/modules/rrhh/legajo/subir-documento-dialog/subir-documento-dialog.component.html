<div class="dialog-container" fxLayout="column" fxLayoutGap="12px">
  <h2 mat-dialog-title>Subir documento</h2>

  <mat-form-field style="width: 100%">
    <mat-label>Tipo de documento</mat-label>
    <mat-select [formControl]="tipoControl" required>
      <mat-option *ngFor="let t of tipos" [value]="t">{{ t }}</mat-option>
    </mat-select>
  </mat-form-field>

  <div class="file-row" fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="10px">
    <button mat-stroked-button color="primary" (click)="fileInput.click()">
      <mat-icon>attach_file</mat-icon> Elegir archivo
    </button>
    <span class="file-name">{{ nombreArchivo || 'Ningún archivo seleccionado' }}</span>
    <input #fileInput type="file" hidden (change)="onArchivoSeleccionado($event)" />
  </div>

  <mat-form-field style="width: 100%">
    <mat-label>Vencimiento (opcional)</mat-label>
    <input matInput [matDatepicker]="picker" [formControl]="vencimientoControl" />
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <mat-form-field style="width: 100%">
    <mat-label>Observación</mat-label>
    <input matInput [formControl]="observacionControl" />
  </mat-form-field>

  <div mat-dialog-actions fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="10px">
    <button mat-stroked-button (click)="onCancelar()">Cancelar</button>
    <button mat-raised-button color="primary" (click)="onGuardar()">Guardar</button>
  </div>
</div>
