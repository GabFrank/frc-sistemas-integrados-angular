<div class="dialog-container" fxLayout="column" fxLayoutGap="10px">
  <h2 mat-dialog-title>{{ selectedConfiguracion.id ? 'Editar' : 'Nueva' }} configuración RRHH</h2>

  <form [formGroup]="formGroup" fxLayout="column" fxLayoutGap="15px">
    <div fxLayout="row" fxLayoutGap="10px">
      <div fxFlex="100%">
        <mat-form-field style="width: 100%">
          <mat-label>Clave</mat-label>
          <input matInput [formControl]="claveControl" required />
          <mat-error *ngIf="claveControl.hasError('required')">
            La clave es obligatoria
          </mat-error>
        </mat-form-field>
      </div>
    </div>

    <div fxLayout="row" fxLayoutGap="10px">
      <div fxFlex="60%">
        <mat-form-field style="width: 100%">
          <mat-label>Valor</mat-label>
          <input matInput [formControl]="valorControl" />
        </mat-form-field>
      </div>
      <div fxFlex="40%">
        <mat-form-field style="width: 100%">
          <mat-label>Tipo</mat-label>
          <mat-select [formControl]="tipoControl" required>
            <mat-option *ngFor="let tipo of tipoOptions" [value]="tipo">
              {{ tipo }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>

    <div fxLayout="row" fxLayoutGap="10px">
      <div fxFlex="100%">
        <mat-form-field style="width: 100%">
          <mat-label>Descripción</mat-label>
          <input matInput [formControl]="descripcionControl" />
        </mat-form-field>
      </div>
    </div>

    <div fxLayout="row" fxLayoutGap="10px">
      <mat-slide-toggle [formControl]="activoControl">Activo</mat-slide-toggle>
    </div>
  </form>

  <div mat-dialog-actions fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="10px">
    <button mat-stroked-button (click)="onCancelar()">Cancelar</button>
    <button
      *ngIf="!isEditting"
      mat-raised-button
      color="primary"
      (click)="onHabilitarEdicion()"
    >
      Editar
    </button>
    <button
      *ngIf="isEditting"
      mat-raised-button
      color="primary"
      [disabled]="formGroup.invalid"
      (click)="onGuardar()"
    >
      Guardar
    </button>
  </div>
</div>
