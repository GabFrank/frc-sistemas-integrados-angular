<app-generic-list titulo="Configuración RRHH" style="height: 100%" [isAdicionar]="true" (adicionar)="onNuevo()"
  (filtrar)="onFiltrar()" (resetFiltro)="onResetFiltro()">

  <div filtros fxLayout="row wrap" fxLayoutGap="10px" style="width: 100%">
    <mat-form-field fxFlex="320px">
      <mat-label>Buscar (clave o descripción)</mat-label>
      <input matInput [formControl]="textoControl" (keyup.enter)="onFiltrar()" />
    </mat-form-field>

    <mat-form-field fxFlex="180px">
      <mat-label>Tipo</mat-label>
      <mat-select [formControl]="tipoControl" (selectionChange)="onFiltrar()">
        <mat-option [value]="null">Todos</mat-option>
        <mat-option *ngFor="let t of tipoOpciones" [value]="t">{{ t }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div table style="height: 100%" fxLayout="column" fxLayoutAlign="space-between start">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2" style="width: 100%">
      <ng-container matColumnDef="clave">
        <th mat-header-cell *matHeaderCellDef>Parámetro</th>
        <td mat-cell *matCellDef="let row">
          <span [matTooltip]="row.clave">{{ row.claveLabel }}</span></td>
      </ng-container>

      <ng-container matColumnDef="valor">
        <th mat-header-cell *matHeaderCellDef>Valor</th>
        <td mat-cell *matCellDef="let row">{{ row.valor }}</td>
      </ng-container>

      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef>Tipo</th>
        <td mat-cell *matCellDef="let row">{{ row.tipo }}</td>
      </ng-container>

      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let row">{{ row.descripcion }}</td>
      </ng-container>

      <ng-container matColumnDef="activo">
        <th mat-header-cell *matHeaderCellDef>Activo</th>
        <td mat-cell *matCellDef="let row">
          <mat-icon>{{ row.activo ? 'check_circle' : 'cancel' }}</mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button [matMenuTriggerFor]="menu" (click)="$event.stopPropagation()">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="onInfo(row)">
              <mat-icon>info</mat-icon><span>¿Qué es esta configuración?</span>
            </button>
            <button mat-menu-item (click)="onEditar(row)">
              <mat-icon>edit</mat-icon><span>Editar</span>
            </button>
            <button mat-menu-item (click)="onEliminar(row)">
              <mat-icon>delete</mat-icon><span>Eliminar</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator itemsPerPageLabel="Ítems por página" [pageSizeOptions]="[15, 25, 50, 100]"
      (page)="handlePageEvent($event)" [length]="selectedPageInfo?.getTotalElements"
      style="width: 100%" showFirstLastButtons></mat-paginator>
  </div>
</app-generic-list>
