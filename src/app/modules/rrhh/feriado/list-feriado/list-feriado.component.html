<div class="feriado-container" fxLayout="column" fxLayoutGap="12px">

  <div class="header" fxLayout="row" fxLayoutAlign="space-between center">
    <h2>Feriados</h2>
    <button mat-raised-button color="primary" (click)="onNuevo()">
      <mat-icon>add</mat-icon> Nuevo
    </button>
  </div>

  <div class="tabla-container">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">

      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let row">{{ row.fecha | date:'dd/MM/yyyy' }}</td>
      </ng-container>

      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let row" class="text-left">{{ row.descripcion }}</td>
      </ng-container>

      <ng-container matColumnDef="esNacional">
        <th mat-header-cell *matHeaderCellDef>Nacional</th>
        <td mat-cell *matCellDef="let row">
          <mat-icon>{{ row.esNacional ? 'check_circle' : 'remove' }}</mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="recargoPorcentaje">
        <th mat-header-cell *matHeaderCellDef>Recargo %</th>
        <td mat-cell *matCellDef="let row">{{ row.recargoPorcentaje | number:'1.0-2' }}</td>
      </ng-container>

      <ng-container matColumnDef="activo">
        <th mat-header-cell *matHeaderCellDef>Activo</th>
        <td mat-cell *matCellDef="let row">
          <mat-icon>{{ row.activo ? 'check_circle' : 'cancel' }}</mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="primary" (click)="onEditar(row)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="onEliminar(row)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
