<div class="bono-container" fxLayout="column" fxLayoutGap="12px">

  <div class="header" fxLayout="row" fxLayoutAlign="space-between center">
    <h2>Bonos</h2>
    <button mat-raised-button color="primary" (click)="onNuevo()">
      <mat-icon>add</mat-icon> Nuevo
    </button>
  </div>

  <div class="filtros" fxLayout="row wrap" fxLayoutGap="10px" fxLayoutAlign="start center">
    <mat-form-field fxFlex="280px">
      <mat-label>Funcionario</mat-label>
      <mat-select [formControl]="funcionarioControl">
        <mat-option *ngFor="let f of funcionarioOpciones" [value]="f.id">{{ f.label }}</mat-option>
      </mat-select>
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="onBuscar()">
      <mat-icon>search</mat-icon> Buscar
    </button>
  </div>

  <div class="tabla-container">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">
      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let row">{{ row.fecha | date:'dd/MM/yyyy' }}</td>
      </ng-container>
      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef>Tipo</th>
        <td mat-cell *matCellDef="let row">{{ row.tipo }}</td>
      </ng-container>
      <ng-container matColumnDef="monto">
        <th mat-header-cell *matHeaderCellDef>Monto</th>
        <td mat-cell *matCellDef="let row">{{ row.monto | number:'1.0-2' }}</td>
      </ng-container>
      <ng-container matColumnDef="motivo">
        <th mat-header-cell *matHeaderCellDef>Motivo</th>
        <td mat-cell *matCellDef="let row" class="text-left">{{ row.motivo }}</td>
      </ng-container>
      <ng-container matColumnDef="recurrente">
        <th mat-header-cell *matHeaderCellDef>Recurrente</th>
        <td mat-cell *matCellDef="let row"><mat-icon *ngIf="row.esRecurrente">autorenew</mat-icon></td>
      </ng-container>
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let row">
          <span *ngIf="row.anulado" class="chip-anulado">ANULADO</span>
          <span *ngIf="!row.anulado">VIGENTE</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="warn" *ngIf="!row.anulado" (click)="onAnular(row)" matTooltip="Anular"><mat-icon>block</mat-icon></button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
