<div class="detalle-container" fxLayout="column" fxLayoutGap="14px" *ngIf="liq">
  <div fxLayout="row" fxLayoutAlign="space-between center">
    <h2 class="titulo">Liquidación {{ liq.periodo }} — {{ liq.funcionario?.persona?.nombre }}</h2>
    <span class="chip" [ngClass]="'chip-' + liq.estado">{{ liq.estado }}</span>
  </div>

  <!-- Alta de item manual: sobre la tabla, oculta hasta que se presiona Agregar Item -->
  <div class="agregar-panel" *ngIf="mostrarAgregar && liq.estado === 'BORRADOR'"
    fxLayout="row" fxLayout.lt-md="column" fxLayoutGap="10px" fxLayoutAlign="start center">
    <mat-form-field fxFlex>
      <mat-label>Concepto</mat-label>
      <input matInput [formControl]="descripcionControl" />
    </mat-form-field>
    <mat-form-field fxFlex="160px">
      <mat-label>Monto</mat-label>
      <input matInput type="number" [formControl]="montoControl" />
    </mat-form-field>
    <mat-form-field fxFlex="160px">
      <mat-label>Tipo</mat-label>
      <mat-select [formControl]="tipoControl">
        <mat-option *ngFor="let t of tipoOptions" [value]="t">{{ t }}</mat-option>
      </mat-select>
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="onGuardarItem()">{{ editandoItemId ? 'Guardar cambios' : 'Guardar item' }}</button>
    <button mat-button (click)="onToggleAgregar()">Cancelar</button>
  </div>

  <div *ngIf="!mostrarAgregar && liq.estado === 'BORRADOR'" fxLayout="row" fxLayoutAlign="end center">
    <button mat-stroked-button color="primary" (click)="onToggleAgregar()">
      <mat-icon>add</mat-icon> Agregar Item
    </button>
  </div>

  <div class="tabla-container">
    <table mat-table [dataSource]="items" class="mat-elevation-z1">
      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef>Concepto</th>
        <td mat-cell *matCellDef="let row" class="text-left">{{ row.descripcion }}</td>
      </ng-container>
      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef>Tipo</th>
        <td mat-cell *matCellDef="let row">
          <span [ngClass]="row.tipo === 'HABER' ? 'haber' : 'descuento'">{{ row.tipo }}</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="monto">
        <th mat-header-cell *matHeaderCellDef>Monto</th>
        <td mat-cell *matCellDef="let row">{{ row.monto | number:'1.0-0' }}</td>
      </ng-container>
      <ng-container matColumnDef="origen">
        <th mat-header-cell *matHeaderCellDef>Origen</th>
        <td mat-cell *matCellDef="let row">
          {{ row.manual ? 'MANUAL' : 'AUTO' }}
          <mat-icon *ngIf="row.editado" class="editado-icon"
            [matTooltip]="'Editado' + (row.editadoPor?.nickname ? ' por ' + row.editadoPor.nickname : '') + (row.montoOriginal != null ? ' · original ' + (row.montoOriginal | number:'1.0-0') : '')">
            edit
          </mat-icon>
        </td>
      </ng-container>
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="primary" *ngIf="liq.estado === 'BORRADOR'" (click)="onEditarItemInit(row)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" *ngIf="row.manual && liq.estado === 'BORRADOR'" (click)="onEliminarItem(row)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="itemsColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: itemsColumns"></tr>
    </table>
  </div>

  <!-- Totales en cards, como en los demás dashboards -->
  <div class="totales-cards" fxLayout="row" fxLayoutGap="12px">
    <dash-stat-chip fxFlex icon="add_circle" color="success"
      [value]="liq.totalHaberes | number:'1.0-0'" label="Haberes"></dash-stat-chip>
    <dash-stat-chip fxFlex icon="remove_circle" color="danger"
      [value]="liq.totalDescuentos | number:'1.0-0'" label="Descuentos"></dash-stat-chip>
    <dash-stat-chip fxFlex icon="payments" color="primary"
      [value]="liq.totalNeto | number:'1.0-0'" label="Neto a pagar"></dash-stat-chip>
  </div>

  <div class="pago" *ngIf="liq.estado === 'APROBADA' && puedePagar" fxLayout="row" fxLayoutGap="10px" fxLayoutAlign="start center">
    <mat-form-field fxFlex="280px">
      <mat-label>Caja Mayor (pago)</mat-label>
      <mat-select [formControl]="cajaControl">
        <mat-option *ngFor="let c of cajas" [value]="c.id">{{ c.nombre }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="acciones-footer" fxLayout="row" fxLayoutAlign="space-between center">
    <button mat-stroked-button (click)="onCerrar()">Cerrar</button>
    <div fxLayout="row" fxLayoutGap="10px">
      <button mat-stroked-button color="accent" *ngIf="liq.estado === 'BORRADOR' && puedeLiquidar" (click)="onRegenerar()">
        <mat-icon>refresh</mat-icon> Regenerar
      </button>
      <button mat-raised-button color="primary" *ngIf="liq.estado === 'BORRADOR' && puedeAprobar" (click)="onAprobar()">Aprobar</button>
      <button mat-stroked-button *ngIf="liq.estado === 'APROBADA' && (puedeLiquidar || puedeAprobar)" (click)="onVolverBorrador()">Volver a borrador</button>
      <button mat-stroked-button *ngIf="liq.estado === 'APROBADA' || liq.estado === 'PAGADA'" (click)="onImprimirRecibo()">
        <mat-icon>visibility</mat-icon> Ver Recibo
      </button>
      <button mat-raised-button color="primary" *ngIf="liq.estado === 'APROBADA' && puedePagar" (click)="onPagar()">Pagar</button>
      <button mat-stroked-button color="warn" *ngIf="liq.estado === 'PAGADA' && puedePagar" (click)="onAnular()">Anular</button>
    </div>
  </div>
</div>
