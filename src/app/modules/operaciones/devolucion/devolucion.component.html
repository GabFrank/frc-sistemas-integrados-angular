<div class="dash-container">
  <!-- Header + filtros -->
  <div class="dash-header">
    <div class="dash-header-title">
      <h1 class="dash-title">Devoluciones</h1>
      <span class="dash-subtitle">
        Panel de control
        <ng-container *ngIf="sucursalFija"> · {{ nombreSucursalFija }}</ng-container>
      </span>
    </div>
    <div class="dash-header-actions">
      <div class="dash-filtros">
        <mat-form-field appearance="outline">
          <mat-label>Desde</mat-label>
          <input matInput type="date" [(ngModel)]="desde" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Hasta</mat-label>
          <input matInput type="date" [(ngModel)]="hasta" />
        </mat-form-field>
      </div>
      <button
        mat-raised-button
        color="primary"
        [disabled]="cargando"
        (click)="cargar()"
      >
        <mat-icon>filter_alt</mat-icon> Aplicar
      </button>
    </div>
  </div>

  <!-- KPIs -->
  <div class="dash-stats-row">
    <dash-stat-chip
      *ngFor="let kpi of kpis"
      [icon]="kpi.icon"
      [color]="kpi.color"
      [label]="kpi.label"
      [value]="kpi.value"
      [loading]="cargando"
    ></dash-stat-chip>
  </div>

  <!-- Accesos rápidos -->
  <div class="dash-quick-actions">
    <dash-quick-action
      *ngFor="let a of accesos"
      [icon]="a.icon"
      [title]="a.title"
      [color]="a.color"
      (action)="a.action()"
    ></dash-quick-action>
  </div>

  <!-- Contenido: chart + por estado (izq) · rankings (der) -->
  <div class="dash-main">
    <div class="dash-col">
      <dash-chart-card
        icon="stacked_bar_chart"
        title="Devoluciones por día"
        [opciones]="serieOpciones"
        [cargando]="cargando"
        [hayDatos]="serieHayDatos"
        alturaMinima="300px"
      ></dash-chart-card>

      <dash-ranking-list
        icon="donut_small"
        title="Por estado"
        [items]="porEstado"
        emptyText="Sin devoluciones en el período"
      ></dash-ranking-list>
    </div>

    <div class="dash-col">
      <dash-ranking-list
        icon="inventory_2"
        title="Top productos devueltos"
        [items]="topProductos"
      ></dash-ranking-list>

      <dash-ranking-list
        icon="report_problem"
        title="Top motivos"
        [items]="topMotivos"
      ></dash-ranking-list>
    </div>
  </div>
</div>
