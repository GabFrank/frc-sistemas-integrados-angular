<div fxLayout="column" style="width: 100%" fxLayoutGap="10px">
  <div fxFlex style="width: 100%; text-align: center; font-weight: bold">
    Item de devolución
  </div>

  <div fxFlex style="text-align: center">
    {{ selectedProducto?.descripcion | uppercase }}
  </div>

  <mat-form-field style="width: 100%">
    <mat-label>Presentación</mat-label>
    <mat-select [formControl]="presentacionControl">
      <mat-option *ngFor="let presentacion of presentacionList" [value]="presentacion">
        {{ presentacion?.descripcion }} ({{ presentacion?.cantidad | number : "1.0-3" }})
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field style="width: 100%">
    <mat-label>Cantidad</mat-label>
    <input #cantidadInput matInput type="number" [formControl]="cantidadControl" />
  </mat-form-field>

  <mat-form-field style="width: 100%">
    <mat-label>Motivo de avería</mat-label>
    <mat-select [formControl]="motivoAveriaControl">
      <mat-option [value]="null">Ninguno</mat-option>
      <mat-option *ngFor="let motivo of motivosAveria" [value]="motivo">
        {{ motivo?.descripcion | uppercase }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field style="width: 100%">
    <mat-label>Costo unitario</mat-label>
    <input matInput type="number" [formControl]="costoUnitarioControl" />
  </mat-form-field>

  <mat-form-field style="width: 100%">
    <mat-label>Lote</mat-label>
    <input matInput [formControl]="loteControl" />
  </mat-form-field>

  <mat-form-field style="width: 100%">
    <mat-label>Vencimiento</mat-label>
    <input matInput [matDatepicker]="picker" [formControl]="vencimientoControl" />
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <mat-form-field style="width: 100%">
    <mat-label>Observación / motivo</mat-label>
    <input matInput [formControl]="motivoControl" />
  </mat-form-field>

  <div fxFlex style="width: 100%; text-align: center">
    <button mat-raised-button color="primary" style="width: 150px" (click)="onCancelar()">
      Cancelar
    </button>
    <button mat-raised-button color="accent" style="width: 150px; margin-left: 10px"
      (click)="onGuardar()" [disabled]="formGroup.invalid">
      Aceptar
    </button>
  </div>
</div>
