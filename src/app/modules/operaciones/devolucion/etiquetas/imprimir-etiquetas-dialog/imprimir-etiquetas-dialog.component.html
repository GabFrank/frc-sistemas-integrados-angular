<div class="etiq-dialog">
  <h2 mat-dialog-title>Imprimir etiquetas de separado</h2>

  <div mat-dialog-content>
    <p class="etiq-sub">
      Se imprimirá una etiqueta por producto ({{ cantidad }} en total) con el
      identificador <strong>{{ data.identificador }}</strong>, producto,
      cantidad, motivo y un código QR.
    </p>

    <table mat-table [dataSource]="filas" class="mat-elevation-z2 etiq-tabla">
      <ng-container matColumnDef="producto">
        <th mat-header-cell *matHeaderCellDef>Producto</th>
        <td mat-cell *matCellDef="let f">{{ f.producto }}</td>
      </ng-container>
      <ng-container matColumnDef="cantidad">
        <th mat-header-cell *matHeaderCellDef>Cantidad</th>
        <td mat-cell *matCellDef="let f">{{ f.cantidad }}</td>
      </ng-container>
      <ng-container matColumnDef="motivo">
        <th mat-header-cell *matHeaderCellDef>Motivo</th>
        <td mat-cell *matCellDef="let f">{{ f.motivo }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas"></tr>
    </table>
  </div>

  <div mat-dialog-actions class="etiq-actions">
    <button mat-stroked-button (click)="onCerrar()">Ahora no</button>
    <span class="etiq-spacer"></span>
    <button mat-stroked-button color="primary" (click)="onPdf()">
      <mat-icon>picture_as_pdf</mat-icon> PDF A4
    </button>
    <button mat-raised-button color="primary" (click)="onTicket()">
      <mat-icon>receipt_long</mat-icon> Ticket
    </button>
  </div>
</div>
