<h2 mat-dialog-title>Crear producto</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline">
      <mat-label>Familia</mat-label>
      <input
        matInput
        formControlName="familia"
        [matAutocomplete]="autoFam"
        placeholder="Buscar familia"
      />
      <mat-autocomplete
        #autoFam
        [displayWith]="displayFamilia"
        (optionSelected)="onFamiliaSelected($event.option.value)"
      >
        <mat-option *ngFor="let f of familiaOptions" [value]="f">{{ f.descripcion }}</mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Subfamilia</mat-label>
      <input
        matInput
        formControlName="subfamilia"
        [matAutocomplete]="autoSub"
        placeholder="Buscar subfamilia"
      />
      <mat-autocomplete #autoSub [displayWith]="displaySubfamilia">
        <mat-option *ngFor="let s of subfamiliaOptions" [value]="s">{{ s.descripcion }}</mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Descripción</mat-label>
      <input matInput formControlName="descripcion" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>IVA</mat-label>
      <mat-select formControlName="iva">
        <mat-option *ngFor="let i of ivaOptions" [value]="i">{{ i }}%</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Presentación</mat-label>
      <mat-select formControlName="tipoPresentacion">
        <mat-option *ngFor="let tp of tipoPresentacionList" [value]="tp.id">
          {{ tp.descripcion }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Cantidad x present.</mat-label>
      <input matInput type="number" formControlName="cantidad" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Precio costo</mat-label>
      <input matInput type="text" currencyMask [options]="opcionesMoneda" formControlName="precioCosto" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Precio venta (sugerido +25%)</mat-label>
      <input matInput type="text" currencyMask [options]="opcionesMoneda" formControlName="precioVenta" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Código de barras (opcional)</mat-label>
      <input matInput formControlName="codigoBarras" placeholder="EAN, si la factura lo trae" />
      <mat-icon matSuffix>qr_code</mat-icon>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="cancelar()" [disabled]="guardando">Cancelar</button>
  <button
    mat-flat-button
    color="primary"
    (click)="guardar()"
    [disabled]="guardando || form.invalid"
  >
    <mat-icon>save</mat-icon> Crear producto
  </button>
</mat-dialog-actions>
