name: Release

on:
  push:
    branches: [develop, release/*, main, master]

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Job 1: semantic-release creates the GitHub Release (no artifacts yet)
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip_build: ${{ steps.redundant.outputs.skip_build }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install semantic-release plugins
        run: npm install -g semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/exec @semantic-release/github

      - name: Fetch semantic-release git notes
        run: git fetch origin 'refs/notes/*:refs/notes/*' || true

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect released version
        id: version
        run: |
          VERSION=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")
          if [[ "$VERSION" == v* ]]; then
            echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
            echo "Released version: ${VERSION#v}"
          else
            echo "No new release created"
          fi

      # Skip the (expensive) build + auto-update publish when the released commit
      # is byte-identical to the previous release on the same channel. This happens
      # e.g. when a beta->master promotion PR triggers "Update branch" (merging
      # master into release/beta adds only merge nodes, no code) yet semantic-release
      # still bumps the version. Publishing it would push a redundant auto-update to
      # every client on that channel for identical code.
      - name: Detect redundant release
        id: redundant
        if: steps.version.outputs.version != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          case "$VERSION" in
            *-alpha*) PREV=$(git tag --sort=-creatordate | grep -- '-alpha\.' | grep -vx "v${VERSION}" | head -1) ;;
            *-beta*)  PREV=$(git tag --sort=-creatordate | grep -- '-beta\.'  | grep -vx "v${VERSION}" | head -1) ;;
            *)        PREV=$(git tag --sort=-creatordate | grep -vE 'alpha|beta' | grep -vx "v${VERSION}" | head -1) ;;
          esac
          if [ -z "$PREV" ]; then
            echo "No previous release on this channel — building."
            echo "skip_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          CUR_TREE=$(git rev-parse "v${VERSION}^{tree}")
          PREV_TREE=$(git rev-parse "${PREV}^{tree}")
          echo "current v${VERSION} tree=${CUR_TREE}"
          echo "previous ${PREV} tree=${PREV_TREE}"
          if [ "$CUR_TREE" = "$PREV_TREE" ]; then
            echo "::warning::v${VERSION} is byte-identical to ${PREV} — skipping build & auto-update publish."
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "Code differs from ${PREV} — building."
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

  # Job 2: build platform artifacts and upload to the release
  build:
    needs: release
    if: needs.release.outputs.version != '' && needs.release.outputs.skip_build != 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            args: --linux
          - os: windows-latest
            platform: win
            args: --win

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Update package.json versions
        shell: bash
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          node -e "
            const fs = require('fs');
            ['package.json', 'app/package.json'].forEach(f => {
              const pkg = JSON.parse(fs.readFileSync(f, 'utf8'));
              pkg.version = '${VERSION}';
              fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + '\n');
            });
          "
          echo "Updated package.json versions to ${VERSION}"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular (production)
        run: npm run build:prod

      - name: Build Electron (${{ matrix.platform }})
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Generate channel manifests
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # Determine channel from version tag
          if [[ "${VERSION}" == *"-alpha"* ]]; then
            CHANNEL="alpha"
          elif [[ "${VERSION}" == *"-beta"* ]]; then
            CHANNEL="beta"
          else
            CHANNEL="latest"
          fi
          echo "Channel: ${CHANNEL}"

          # Copy manifests with channel name
          # electron-updater looks for {channel}.yml and {channel}-linux.yml
          if [ "${CHANNEL}" != "latest" ]; then
            for f in release/latest*.yml; do
              if [ -f "$f" ]; then
                NEWNAME=$(echo "$f" | sed "s/latest/${CHANNEL}/")
                cp "$f" "$NEWNAME"
                echo "Created $NEWNAME"
              fi
            done
          else
            echo "Channel is latest — manifests already have correct names, skipping copy"
          fi

      - name: Upload artifacts to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          echo "Uploading ${{ matrix.platform }} artifacts to release v${VERSION}..."
          # Collect files individually (handles filenames with spaces)
          FILES=()
          for f in release/*.exe release/*.AppImage release/*.yml release/*.blockmap; do
            [ -f "$f" ] && FILES+=("$f")
          done
          if [ ${#FILES[@]} -gt 0 ]; then
            gh release upload "v${VERSION}" "${FILES[@]}" --clobber
          else
            echo "WARNING: No artifacts found to upload!"
            exit 1
          fi
